name: Enforce PMD Quality Gate

on: [push, pull_request]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Download PMD Report
        uses: actions/download-artifact@v3
        with:
          name: PMD-Report
          path: pmd-report.xml

      - name: Enforce Quality Gate
        run: |
          violations=$(xmllint --xpath "count(//violation)" pmd-report.xml)
          echo "PMD Violations: $violations"
          if [ "$violations" -gt 5 ]; then
            echo "❌ PMD Quality Gate Failed!"
            exit 1
          else
            echo "✅ PMD Quality Gate Passed!"
          fi
