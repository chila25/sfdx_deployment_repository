name: Rollback Deployment

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Salesforce CLI
      run: npm install sfdx-cli --global

    - name: Authenticate to DevSandbox
      run: echo ${{ secrets.DEV_SFDX_AUTH_URL }} | sfdx auth:sfdxurl:store --setalias DevSandbox

    - name: Rollback to Backup State
      run: sfdx force:source:deploy -p backups/last-good-state -u DevSandbox --wait 10
