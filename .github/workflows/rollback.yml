name: Rollback Deployment

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Salesforce CLI
      run: npm install --global @salesforce/cli

    - name: Authenticate to DevSandbox
      run: echo ${{ secrets.DEV_SFDX_AUTH_URL }} | sf auth:sfdxurl:store --alias DevSandbox

    - name: Rollback to Backup State
      run: sf project deploy start --source-dir backups/last-good-state --target-org DevSandbox --wait 10

    - name: Send Email on Rollback Failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Rollback Deployment Failed"
        to: padduja712@gmail.com
        from: ci-cd@yourcompany.com
        body: |
          🚨 Rollback failed on branch ${{ github.ref }}.
          Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
