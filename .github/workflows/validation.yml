name: Validation

on:
  push:
    branches:
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Salesforce CLI
      run: npm install --global @salesforce/cli

    - name: Authenticate to DevSandbox
      run: echo "${{ secrets.DEV_SF_AUTH_URL }}" | sf auth:sfdxurl:store --alias DevSandbox --sfdx-url-stdin

    - name: Validate Metadata (Full Project)
      run: sf project deploy start --source-dir force-app/main/default --dry-run --target-org DevSandbox

    - name: Send Email on Validation Failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Validation Failure"
        to: padduja712@gmail.com
        from: ci-cd@yourcompany.com
        body: |
          🚨 Validation failed on branch ${{ github.ref }}.
          Workflow: ${{ github.workflow }}
          Run: ${{ github.run_number }}.
          Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
