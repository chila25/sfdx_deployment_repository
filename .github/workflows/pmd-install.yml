name: Install PMD

on: [push, pull_request]

jobs:
  install-pmd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install Java (required for PMD)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download PMD
        run: |
          wget https://github.com/pmd/pmd/releases/download/pmd_releases/7.16.0/pmd-bin.zip
          unzip pmd-bin.zip
          mv pmd-bin pmd

      - name: Verify PMD Installation
        run: ./pmd/bin/run.sh pmd -version
