name: Failure Notification

on:
  workflow_run:
    workflows: ["Validation", "Apex Tests", "Deploy to Dev", "Deploy to UAT", "Deploy to Production"]
    types:
      - completed

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
    - name: Send Email Notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: 'CI/CD Pipeline Failure Alert'
        to: padduja712@gmail.com
        from: ci-cd-notify@yourdomain.com
        body: |
          🚨 The workflow "${{ github.event.workflow_run.name }}" failed.
          - Branch: ${{ github.event.workflow_run.head_branch }}
          - Conclusion: ${{ github.event.workflow_run.conclusion }}
          - Logs: ${{ github.event.workflow_run.html_url }}
