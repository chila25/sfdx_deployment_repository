name: Deploy to Dev

on:
  push:
    branches:
      - dev

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Salesforce CLI
      run: npm install sfdx-cli --global

    - name: Authenticate to DevSandbox
      run: echo ${{ secrets.DEV_SFDX_AUTH_URL }} | sfdx auth:sfdxurl:store --setalias DevSandbox

    - name: Deploy Metadata to DevSandbox
      run: sfdx force:source:deploy -p force-app/main/default -u DevSandbox --wait 10

    - name: Send Email on Deploy to Dev Failure
      if: failure()
      run: |
        echo "Deploy to Dev failed!" | mail -s "Dev Deployment Failure" ${{ secrets.EMAIL_USERNAME }}
